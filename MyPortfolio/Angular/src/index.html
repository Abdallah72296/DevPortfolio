<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="utf-8">
  <title>DevFolio Studio - Portfolio Builder & Architect Console</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="preload" href="assets/vendor/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/vendor/fonts/material-symbols-outlined-subset.woff2" as="font" type="font/woff2"
    crossorigin>
  <link rel="stylesheet" href="assets/vendor/devicon.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons.min.css">
  <script>
    (function () {
      try {
        var path = window.location.pathname || '';
        var match = path.match(/\/(?:u|portfolio|portfolio-mobile)\/([a-zA-Z0-9_\-\.]+)/i);
        var u = match ? match[1] : (new URLSearchParams(window.location.search).get('u') || '');
        var theme = (u && localStorage.getItem('portfolio.theme.' + u.toLowerCase()))
          || localStorage.getItem('portfolio.theme.global')
          || 'obsidian-dark';
        document.documentElement.dataset.portfolioTheme = theme;
        var isLight = theme === 'light' || theme === 'paper' || theme === 'ecosync';
        if (isLight) {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
        }
        var applyBody = function () {
          if (document.body) {
            document.body.dataset.portfolioTheme = theme;
            if (isLight) {
              document.body.classList.remove('dark');
              document.body.classList.add('light');
            } else {
              document.body.classList.remove('light');
              document.body.classList.add('dark');
            }
          }
        };
        if (document.body) applyBody();
        else document.addEventListener('DOMContentLoaded', applyBody);
      } catch (e) { }
    })();
  </script>
</head>

<body class="bg-background font-body-md text-on-surface antialiased">
  <app-root></app-root>
</body>

</html>
